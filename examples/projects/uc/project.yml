project:
  name: "uc"
  description: "Ultimate Container"
  security_class: "online"      # agent can push directly to upstream

git:
  upstream_url: "https://gitlab.com/electric-sheep/ultimate-container.git"
  default_branch: "main"

image:
  base_image: "ubuntu:24.04"
  user_snippet_file: "user.dockerinclude"

agent:
  instructions:
    - _inherit
    - |
      ## Extra tools
      - **ctags** (Universal Ctags) is installed. Run `ctags -R --languages=C,C++ /workspace/src` to index the codebase.

# Default agent for this project (used for Web UI, and potentially CLI in the future).
# Overrides the global config. Can also be set via DEFAULT_AGENT env var or --backend CLI flag.
# Valid values: codex, claude, mistral
# default_agent: claude

# Runtime settings for this project
run:
  # Enable GPU passthrough for this project (per-project only). Default is disabled.
  # Accepts boolean true or string "all" to enable; omitted/false disables.
  # Note: GPU-enabled projects typically require a CUDA/NVIDIA-capable base image.
  # Configure under image.base_image accordingly.
  # gpus: all

# Egress firewall (shield) per-project policy.
# shield:
#   # Curated egress sets granted to this project's tasks (t40 allow tier).
#   # `recommended` grants every curated set, including ones added in future
#   # releases; unset or [] grants none.  List the available names with
#   # `terok shield sets`, or freeze a selection such as
#   # [git-hosting, python, os-packages].
#   sets: [recommended]
#   # Extra hosts allowed while the shield is up (below the security-deny).
#   allow:
#     - ftp.mirror.example.org
#   # Break-glass overrides ABOVE the security-deny — host, IP, or CIDR (a
#   # range is logged as a warning), mandatory reason, optional expiry
#   # (evaluated at each container (re)start).
#   override:
#     - host: api.example.org
#       reason: direct endpoint testing
#       expires: 2099-12-31
