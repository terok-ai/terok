# Same-repo SonarQube Cloud scan.  The job body lives in terok-util's
# fleet-sonar.yml (reusable across the package family), pinned here by
# reviewed branch.  Fork PRs are handled by sonar_pr.yml via workflow_run in
# the trusted base-repo context, because GitHub does not expose
# SONAR_TOKEN to runs originating from forks.
name: SonarQube Cloud

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  sonar:
    uses: sliwowitz/terok-util/.github/workflows/fleet-sonar.yml@fix/container-boundaries
    secrets:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
