# Pin third-party actions to full commit SHAs for supply-chain security.
# GitHub-owned actions (actions/*) may use version tags.
#
# The static-check battery lives in terok-util's fleet-checks.yml
# (reusable across the package family); only the repo-specific
# import-linter and host-integration jobs stay local.
name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  checks:
    uses: terok-ai/terok-util/.github/workflows/fleet-checks.yml@v0.3.1
    with:
      run-lint-imports: true

  integration-tests-host:
    name: Integration tests (host)
    if: github.repository == 'terok-ai/terok'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Run host-only integration tests
        run: make test-integration-host

      - name: Upload test results to Codecov
        if: ${{ !cancelled() }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v5
        with:
          files: ./reports/integration-host.junit.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          report_type: test_results
